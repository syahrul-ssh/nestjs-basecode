services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    mem_limit: 512m
    cpus: "0.5"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-nestjs_basecode}
    expose:
      - "${DATABASE_PORT:-5432}"
    mem_limit: 512m
    cpus: "0.5"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    expose:
      - "${REDIS_PORT:-6379}"
    mem_limit: 128m
    cpus: "0.25"

volumes:
  postgres_data:
